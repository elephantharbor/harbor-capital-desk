<script>
/* Public github.io → authenticated console (cheap redirect; gate enforces auth) */
(function () {
  try {
    if (location.hostname === "elephantharbor.github.io") {
      location.replace(
        "https://console.elephantharbor.com" +
          location.pathname +
          location.search +
          location.hash
      );
    }
  } catch (e) {}
})();
</script>
